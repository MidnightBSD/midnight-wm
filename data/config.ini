[Workspace]
panel_label=MidnightBSD
clock_format=%a %H:%M
# Show battery status in the panel when a battery is present; applies live.
show_battery=true
# Enable dark controls, menus, folders, decorations, and notifications.
# Requests dark appearance through the portal and Adwaita-dark for GTK X11 apps.
# Disabling restores the configured GTK theme; existing XSETTINGS owners take precedence.
dark_mode=false
# Show shell menus immediately without reveal animation; applies live.
# Does not control animations in applications or the compositor.
reduced_motion=false
# Start Picom for soft window shadows; preserve an existing compositor. Applies live.
compositing=true
# Pango family/style descriptions; optional size is in points (6 to 32).
# Omit sizes to keep the default size of each UI element.
ui_font=Sans
title_font=Sans Bold
# Desktop background, in #RRGGBB format (also used in dark mode).
desktop_color=#7866a8
# Wallpaper path (absolute, ~/..., or relative to this config file).
# Supported formats: PNG, JPEG, GIF (first frame), and SVG via GdkPixbuf.
# The image repeats independently on each monitor. Filename lookup also
# searches XDG background directories and
# /usr/local/share/backgrounds/midnightbsd (the midnightbsd-backgrounds port).
# When unset, mnbsd_bg_purple.png is used if installed; otherwise only
# desktop_color is shown. Set it empty to use desktop_color alone.
# desktop_image=mnbsd_bg_purple.png
# Wallpaper sizing: fill (default, centered crop) or fit (whole image centered).
# desktop_image_mode=fill
# Optional panel override; otherwise follows dark_mode:
# panel_color=#c4c4c4
accent_color=#3b205f
# Override automatic scaling with a value from 0.75 to 3.0:
# ui_scale=1.0

[Desktop]
show_documents=true
show_pictures=true
show_music=false
show_videos=false
show_public_share=false

[Shortcuts]
# Edit these in Settings -> Keyboard shortcuts. Ctrl, Alt, Super, and Shift
# may be combined with letters, digits, function, arrow, or navigation keys.
# Set an action to None to disable it. Changes apply live after saving.
# workspace_left=Ctrl+Alt+Left
# workspace_right=Ctrl+Alt+Right
# workspace_up=Ctrl+Alt+Up
# workspace_down=Ctrl+Alt+Down
# show_desktop=Super+D
# switch_window=Alt+Tab
# close_window=Alt+F4
# move_window=Alt+F7
# resize_window=Alt+F8
# minimize_window=Alt+F9
# maximize_window=Alt+F10
# switch_window_backward=Alt+Shift+Tab
# open_launcher=Ctrl+Escape
# Launcher: Up/Down select, Right opens a submenu, Left returns, Enter activates, Escape closes.
# Move/resize: arrows adjust 10 pixels, Ctrl+arrows 1; Enter accepts, Escape cancels.
# These operations target external application windows.

[Session]
# Start the XScreenSaver background daemon at login when installed.
# Preserve a daemon already running on the display. Applies at next login.
start_xscreensaver=true
# Opt-in folder restoration; independent of application restoration below.
# Disable restore_folders to start fresh, independently of saving on logout.
restore_folders=false
save_on_logout=false
# Persist successful XSMP global checkpoints and coordinated logout saves.
# Saving is independent of application restoration and folder saving.
# The companion reads this preference for each checkpoint. A normal successful
# WM exit saves before coordinated client shutdown; crashes/signals do not save.
save_application_checkpoints=false
# Reopen participating XSMP applications after the companion and WM services
# are ready. Requires midnightbsd-session; independent of checkpoint saving.
# Restores matching window placement; no document guarantees or process resumption.
restore_applications=false
# Also reopen recognized non-XSMP apps once through installed desktop entries.
# Requires restore_applications=true; no documents, commands or placement saved.
restore_desktop_applications=false
