[Workspace]
panel_label=Midnight ▾
clock_format=%a %H:%M
# Show battery status in the panel when a battery is present; applies live.
show_battery=true
# Enable dark controls, menus, folders, decorations, and notifications.
dark_mode=false
# Pango family/style descriptions; optional size is in points (6 to 32).
# Omit sizes to keep the default size of each UI element.
ui_font=Sans
title_font=Sans Bold
# Desktop background, in #RRGGBB format (also used in dark mode).
desktop_color=#7866a8
# Wallpaper path (absolute, ~/..., or relative to this config file).
# Supported formats: PNG, JPEG, GIF (first frame), and SVG via GdkPixbuf.
# The image repeats independently on each monitor. Filename lookup also
# searches XDG background directories and
# /usr/local/share/backgrounds/midnightbsd (the midnightbsd-backgrounds port).
# When unset, mnbsd_bg_purple.png is used if installed; otherwise only
# desktop_color is shown. Set it empty to use desktop_color alone.
# desktop_image=mnbsd_bg_purple.png
# Wallpaper sizing: fill (default, centered crop) or fit (whole image centered).
# desktop_image_mode=fill
# Optional panel override; otherwise follows dark_mode:
# panel_color=#c4c4c4
accent_color=#3b205f
# Override automatic scaling with a value from 0.75 to 3.0:
# ui_scale=1.0

[Desktop]
show_documents=true
show_pictures=true
show_music=false
show_videos=false
show_public_share=false
